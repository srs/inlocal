[package]
name = "inlocal-core"
version = "0.1.0"
edition = "2021"
description = "Read, check and edit inlang translation files without changing untouched bytes"
license = "MIT"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
