[package]
name = "inlocal"
version = "0.1.0"
edition = "2021"
description = "A local, open-source translation editor for inlang projects"
license = "MIT"
repository = "https://github.com/srs/inlocal"
keywords = ["i18n", "inlang", "translation", "paraglide", "i18next"]
categories = ["command-line-utilities", "internationalization"]

[workspace]
members = [".", "crates/core"]

[features]
default = ["web"]
# The browser editor (`inlocal serve`). Turn it off with
# `--no-default-features` for a slim CLI/TUI build, for example in CI.
web = ["dep:axum", "dep:tokio", "dep:tokio-stream", "dep:mime_guess", "dep:rust-embed", "dep:open"]

[dependencies]
inlocal-core = { path = "crates/core" }
anyhow = "1"
axum = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"] }
mime_guess = { version = "2", optional = true }
notify = "8"
open = { version = "5", optional = true }
ratatui = "0.30"
rust-embed = { version = "8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }

[profile.release]
lto = true
strip = true
